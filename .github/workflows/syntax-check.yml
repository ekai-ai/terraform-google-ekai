name: Syntax check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [., examples/self-deploy/root, examples/self-deploy/cicd]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in scripts/*.sh; do bash -n "$f"; done

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.66.0
      # The token avoids GitHub's anonymous API rate limit when --init downloads plugins.
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Fail on errors only -- the existing warnings (missing provider version
      # constraints, unused declarations) predate this job and need a cleanup pass.
      - run: tflint --recursive --minimum-failure-severity=error
