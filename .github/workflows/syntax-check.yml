name: Syntax check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [., examples/self-deploy/root, examples/self-deploy/cicd]
        # The oldest Terraform README.md supports, plus the current release.
        # The oldest one is what catches config only newer versions accept.
        terraform: ["1.6.6", "1.17.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in scripts/*.sh; do bash -n "$f"; done
